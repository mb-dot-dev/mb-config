name: Publish
run-name: Publish Package
on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/mb-dot-dev/gha-sdk-images:1.0.0
    environment:
      name: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          uv version "$VERSION"

      - name: Build package
        run: |
          uv build
      
      - name: Publish package
        run: uv publish
